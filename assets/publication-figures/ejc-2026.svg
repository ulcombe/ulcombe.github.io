<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc">
  <title id="title">Early-stage melanoma MEL12 validation</title>
  <desc id="desc">Survival curves and platform markers representing cross-platform prognostic robustness.</desc>
  <rect width="640" height="380" rx="28" fill="#fcf6ee"/>
  <rect x="24" y="24" width="592" height="332" rx="22" fill="#fffaf3" stroke="#e8ddd0"/>
  <text x="48" y="60" fill="#7c2f1c" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">MEL12 remained prognostic in FFPE tissue</text>
  <text x="48" y="84" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="13">Training and validation cohorts, NanoString and RNA-seq, up to 15-year follow-up</text>
  <line x1="72" y1="274" x2="340" y2="274" stroke="#b8aa99" stroke-width="2"/>
  <line x1="72" y1="274" x2="72" y2="122" stroke="#b8aa99" stroke-width="2"/>
  <path d="M84 134 C136 138, 174 146, 214 164 S286 198, 328 218" fill="none" stroke="#6f8f7b" stroke-width="4" stroke-linecap="round"/>
  <path d="M84 146 C142 156, 190 178, 224 204 S282 232, 328 250" fill="none" stroke="#c49732" stroke-width="4" stroke-linecap="round"/>
  <path d="M84 162 C152 186, 196 214, 242 236 S294 258, 328 268" fill="none" stroke="#b24a2d" stroke-width="4" stroke-linecap="round"/>
  <text x="80" y="112" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="12">Melanoma-specific survival</text>
  <text x="250" y="296" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="12">Years</text>
  <rect x="404" y="132" width="50" height="50" rx="12" fill="#6f8f7b"/>
  <rect x="474" y="132" width="50" height="50" rx="12" fill="#b24a2d"/>
  <circle cx="429" cy="206" r="23" fill="#6f8f7b"/>
  <circle cx="499" cy="206" r="23" fill="#b24a2d"/>
  <text x="389" y="110" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="12">NanoString</text>
  <text x="468" y="110" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="12">RNA-seq</text>
  <text x="384" y="258" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="13">Similar MEL12 behaviour across platforms</text>
  <text x="384" y="278" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="13">and independent validation cohorts.</text>
</svg>
