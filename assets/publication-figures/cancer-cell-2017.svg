<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc">
  <title id="title">Uveal melanoma four-subtype model</title>
  <desc id="desc">Four grouped tracks showing multi-omic subtype separation and prognosis.</desc>
  <rect width="640" height="380" rx="28" fill="#fcf6ee"/>
  <rect x="24" y="24" width="592" height="332" rx="22" fill="#fffaf3" stroke="#e8ddd0"/>
  <text x="48" y="60" fill="#7c2f1c" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Four clinically meaningful uveal melanoma subsets</text>
  <text x="48" y="84" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="13">Integrated copy number, mutation, RNA, noncoding RNA, and methylation signals</text>
  <rect x="72" y="126" width="96" height="142" rx="14" fill="#6f8f7b"/>
  <rect x="184" y="126" width="96" height="142" rx="14" fill="#9ab09d"/>
  <rect x="296" y="126" width="96" height="142" rx="14" fill="#d59d4f"/>
  <rect x="408" y="126" width="96" height="142" rx="14" fill="#b24a2d"/>
  <text x="94" y="290" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="12">D3 / EIF1AX</text>
  <text x="194" y="290" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="12">D3 / SF3B1</text>
  <text x="316" y="290" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="12">M3 / BAP1-A</text>
  <text x="430" y="290" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="12">M3 / BAP1-B</text>
  <line x1="118" y1="150" x2="118" y2="248" stroke="#fffaf3" stroke-width="5"/>
  <line x1="230" y1="150" x2="230" y2="248" stroke="#fffaf3" stroke-width="5"/>
  <line x1="342" y1="150" x2="342" y2="248" stroke="#fffaf3" stroke-width="5"/>
  <line x1="454" y1="150" x2="454" y2="248" stroke="#fffaf3" stroke-width="5"/>
  <path d="M520 258 C548 248, 562 232, 572 214" fill="none" stroke="#b24a2d" stroke-width="4" stroke-linecap="round"/>
  <path d="M520 242 C548 234, 562 214, 572 186" fill="none" stroke="#c49732" stroke-width="4" stroke-linecap="round"/>
  <text x="490" y="168" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="12">Outcome worsens</text>
  <text x="490" y="184" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="12">toward the M3 groups</text>
</svg>
