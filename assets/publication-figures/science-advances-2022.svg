<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc">
  <title id="title">HCK inhibition and immunotherapy response</title>
  <desc id="desc">Tumour growth curves and CD8 infiltration bars representing improved response after HCK inhibition.</desc>
  <rect width="640" height="380" rx="28" fill="#fcf6ee"/>
  <rect x="24" y="24" width="592" height="332" rx="22" fill="#fffaf3" stroke="#e8ddd0"/>
  <text x="48" y="60" fill="#7c2f1c" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">HCK inhibition sensitized tumours to immunotherapy</text>
  <text x="48" y="84" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="13">Myeloid reprogramming, tumour growth suppression, and improved T-cell recruitment</text>
  <line x1="72" y1="274" x2="312" y2="274" stroke="#b8aa99" stroke-width="2"/>
  <line x1="72" y1="274" x2="72" y2="122" stroke="#b8aa99" stroke-width="2"/>
  <path d="M84 252 C132 238, 184 232, 236 226 S282 220, 304 214" fill="none" stroke="#b8aa99" stroke-width="4" stroke-linecap="round"/>
  <path d="M84 246 C132 230, 176 214, 222 194 S276 168, 304 152" fill="none" stroke="#c49732" stroke-width="4" stroke-linecap="round"/>
  <path d="M84 242 C132 220, 172 192, 214 162 S270 132, 304 124" fill="none" stroke="#b24a2d" stroke-width="4" stroke-linecap="round"/>
  <text x="176" y="296" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="12">Treatment time</text>
  <text x="30" y="214" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="12" transform="rotate(-90 30 214)">Tumour burden</text>
  <rect x="402" y="174" width="48" height="88" rx="10" fill="#b8aa99"/>
  <rect x="474" y="144" width="48" height="118" rx="10" fill="#c49732"/>
  <rect x="546" y="118" width="48" height="144" rx="10" fill="#b24a2d"/>
  <text x="396" y="288" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="12">Control</text>
  <text x="464" y="288" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="12">ICI</text>
  <text x="528" y="288" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="12">ICI + HCKi</text>
  <text x="426" y="104" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="12">CD8 infiltration</text>
</svg>
