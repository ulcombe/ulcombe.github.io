<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc">
  <title id="title">RNA-seq microRNA signature validation</title>
  <desc id="desc">Scatter and grouped risk bars representing cross-platform agreement and preserved prognostic groups.</desc>
  <rect width="640" height="380" rx="28" fill="#fcf6ee"/>
  <rect x="24" y="24" width="592" height="332" rx="22" fill="#fffaf3" stroke="#e8ddd0"/>
  <text x="48" y="60" fill="#7c2f1c" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Cross-platform RNA-seq validation</text>
  <text x="48" y="84" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="13">MEL38 and MEL12 translated from prior profiling workflows into sequencing data</text>
  <line x1="72" y1="268" x2="282" y2="268" stroke="#b8aa99" stroke-width="2"/>
  <line x1="72" y1="268" x2="72" y2="118" stroke="#b8aa99" stroke-width="2"/>
  <path d="M72 268 L282 118" fill="none" stroke="#d8c7b5" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="108" cy="236" r="7" fill="#6f8f7b"/>
  <circle cx="128" cy="214" r="7" fill="#6f8f7b"/>
  <circle cx="152" cy="198" r="7" fill="#6f8f7b"/>
  <circle cx="186" cy="182" r="7" fill="#c49732"/>
  <circle cx="208" cy="158" r="7" fill="#c49732"/>
  <circle cx="234" cy="138" r="7" fill="#b24a2d"/>
  <circle cx="258" cy="126" r="7" fill="#b24a2d"/>
  <text x="102" y="126" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="12">NanoString-like score</text>
  <text x="172" y="286" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="12">RNA-seq score</text>
  <rect x="354" y="146" width="48" height="110" rx="10" fill="#6f8f7b"/>
  <rect x="430" y="174" width="48" height="82" rx="10" fill="#c49732"/>
  <rect x="506" y="210" width="48" height="46" rx="10" fill="#b24a2d"/>
  <text x="349" y="286" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="12">Low</text>
  <text x="422" y="286" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="12">Intermediate</text>
  <text x="505" y="286" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="12">High</text>
  <text x="350" y="126" fill="#54626f" font-family="Arial, Helvetica, sans-serif" font-size="12">Risk groups preserved after assay change</text>
</svg>
